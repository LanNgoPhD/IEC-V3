<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>IEC V3 – TA Review</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="common.js"></script></head><body><div class="wrap">
<div class="card"><h1>IEC V3 – TA REVIEW</h1><div id="meta" class="sub"></div><div class="row"><button id="reload" class="secondary">TẢI LẠI DANH SÁCH</button></div></div>
<div id="empty" class="card hidden"><h2>Không còn GREEN chờ duyệt</h2></div>
<div id="review" class="card hidden"><div class="tag" id="position"></div><h2 id="word"></h2><div class="grid"><div><b>Sinh viên</b><div id="student"></div></div><div><b>DAY</b><div id="day"></div></div><div><b>Vị trí ước tính trong video</b><div id="offset"></div></div></div><div class="row" style="margin-top:14px"><a id="video" class="btn secondary" target="_blank" rel="noopener noreferrer">MỞ VIDEO</a></div><hr style="border:0;border-top:1px solid #e3e7ee;margin:18px 0"><div class="row"><button id="blue" class="good">BLUE – ĐẠT</button><button id="red" class="bad">RED – CẦN LUYỆN LẠI</button></div><div id="redFields" class="hidden" style="margin-top:14px"><label><b>Lỗi</b></label><select id="error"></select><br><br><label><b>Nhận xét (không bắt buộc)</b></label><textarea id="comment" rows="3" style="width:100%"></textarea></div><div id="msg" class="msg"></div></div>
</div><iframe name="submitFrame" class="hidden"></iframe>
<script>
let CLASS=qp('class'),TOKEN=qp('token'),QUEUE=[],POS=0,DECISION='';
document.addEventListener('DOMContentLoaded',async()=>{window.addEventListener('message',handleMessage);document.getElementById('reload').onclick=loadQueue;document.getElementById('blue').onclick=()=>submitDecision('BLUE');document.getElementById('red').onclick=()=>{DECISION='RED';document.getElementById('redFields').classList.remove('hidden');setMsg(document.getElementById('msg'),'Chọn lỗi rồi bấm RED lần nữa để gửi.');document.getElementById('red').onclick=()=>submitDecision('RED')};try{await loadClientConfig();if(!CLASS||!TOKEN)throw new Error('Thiếu CLASS/token TA');await loadQueue()}catch(e){document.getElementById('meta').textContent=String(e.message||e)}});
async function loadQueue(){const d=await jsonp(API_BASE+'?api=ta-queue&class='+encodeURIComponent(CLASS)+'&token='+encodeURIComponent(TOKEN));if(!d||d.ok===false){alert(d&&d.error||'Không tải được danh sách');return}QUEUE=d.items||[];POS=0;document.getElementById('meta').textContent=CLASS+' · '+(d.reviewer||'TA')+' · GREEN chờ duyệt: '+QUEUE.length;const s=document.getElementById('error');s.innerHTML='<option value="">-- Chọn lỗi --</option>';((d.errorTags&&d.errorTags.length)?d.errorTags:['Phát âm','Trọng âm','Âm cuối','Phản xạ','Ngắt câu','Ngữ điệu','Sai từ','Khác']).forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;s.appendChild(o)});render()}
function render(){document.getElementById('redFields').classList.add('hidden');document.getElementById('comment').value='';document.getElementById('error').value='';DECISION='';if(POS>=QUEUE.length){document.getElementById('review').classList.add('hidden');document.getElementById('empty').classList.remove('hidden');return}document.getElementById('empty').classList.add('hidden');document.getElementById('review').classList.remove('hidden');const x=QUEUE[POS];document.getElementById('position').textContent=(POS+1)+' / '+QUEUE.length;document.getElementById('word').textContent=x.english;document.getElementById('student').textContent=(x.studentName?x.studentName+' · ':'')+x.studentId;document.getElementById('day').textContent=x.programDay;document.getElementById('offset').textContent=fmtSec(x.videoOffsetSec);const v=document.getElementById('video');v.href=x.clipUrl||'#';v.style.opacity=x.clipUrl?'1':'.5';setMsg(document.getElementById('msg'),'')}
function submitDecision(decision){const x=QUEUE[POS],error=document.getElementById('error').value,comment=document.getElementById('comment').value.trim();if(decision==='RED'&&!error){setMsg(document.getElementById('msg'),'Hãy chọn lỗi trước khi gửi RED.','err');return}document.getElementById('blue').disabled=true;document.getElementById('red').disabled=true;setMsg(document.getElementById('msg'),'Đang lưu...');postPayload({api:'ta-review-submit',classId:CLASS,token:TOKEN,reviewId:x.reviewId,decision:decision,errorTag:error,comment:comment})}
function handleMessage(e){const d=e.data;if(!d||typeof d!=='object'||d.ok===undefined)return;document.getElementById('blue').disabled=false;document.getElementById('red').disabled=false;if(!d.ok){setMsg(document.getElementById('msg'),'LỖI: '+String(d.error||'Không xác định'),'err');return}QUEUE.splice(POS,1);setMsg(document.getElementById('msg'),'Đã lưu '+d.finalStatus+'.','ok');setTimeout(render,350)}
</script></body></html>
