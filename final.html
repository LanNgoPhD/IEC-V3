<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>IEC V3 – Final</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="common.js"></script></head><body><div class="wrap">
<div class="card"><h1>IEC V3 – FINAL</h1><div class="sub">Nói thuật ngữ tiếng Anh tương ứng. STT nhận đúng text sau chuẩn hóa = PASS.</div><div id="meta" class="statusbar"></div><div class="row"><button id="startBtn">BẮT ĐẦU FINAL</button><button id="nextBtn" class="secondary hidden">TIẾP THEO</button><button id="stopBtn" class="secondary hidden">DỪNG</button></div><div id="topMsg" class="msg"></div></div>
<div id="testCard" class="card hidden"><div id="progress" class="tag"></div><div id="vietnamese" class="bigword">---</div><div id="timer" class="timer"></div><div id="status" class="statusbar"></div><div class="info-grid"><b>Hệ thống nghe được</b><span id="heard">---</span><b>Câu trả lời đầu tiên</b><span id="firstAnswer">---</span><b>Câu trả lời cuối cùng</b><span id="finalAnswer">---</span><b>AGAIN</b><span id="restartInfo">---</span></div></div>
<div id="clipBox" class="card hidden"><h2>Nộp link video</h2><input id="clipUrl" type="text" placeholder="https://..."><div class="row" style="margin-top:10px"><button id="clipBtn" disabled>NỘP LINK VIDEO</button></div><div id="submitMsg" class="msg"></div></div>
</div><iframe name="submitFrame" class="hidden"></iframe>
<script>
let CTX,DATA,WORDS=[],idx=0,testRunning=false,responseLocked=false,recognition=null;
let sessionId='',testStartIso='',testStartPerf=0,wordStartTime=null,firstSpeechTime=null,currentUtterance='',firstAnswer='',finalAnswer='',finalAlternatives=[],restartCount=0,voiceDetectedCurrent=false;
let reactionClock=null,reactionDeadline=null,maxSpeechTimer=null,silenceTimer=null,finalResults=[],clipPending=false;
document.addEventListener('DOMContentLoaded',async()=>{window.addEventListener('message',handleBackendMessage);document.getElementById('startBtn').addEventListener('click',startTest);document.getElementById('nextBtn').addEventListener('click',nextNow);document.getElementById('stopBtn').addEventListener('click',stopTest);document.getElementById('clipBtn').addEventListener('click',submitClip);try{CTX=requireContext();await loadClientConfig();document.getElementById('meta').textContent='Sẵn sàng'}catch(e){setMsg(document.getElementById('topMsg'),String(e.message||e),'err');document.getElementById('startBtn').disabled=true}});
async function startTest(){const btn=document.getElementById('startBtn');btn.disabled=true;try{const url=API_BASE+'?api=final-data&class='+encodeURIComponent(CTX.classId)+'&student='+encodeURIComponent(CTX.studentId)+'&run='+encodeURIComponent(CTX.runId)+'&token='+encodeURIComponent(CTX.token);DATA=await jsonp(url,60000);if(!DATA||DATA.ok===false)throw new Error(DATA&&DATA.error||'Không tải được Final');if(DATA.submitted){document.getElementById('meta').textContent='DAY '+DATA.run.programDay+' · Final đã nộp';btn.classList.add('hidden');const summary='BLUE='+Number(DATA.blue||0)+' · GREEN='+Number(DATA.green||0)+' · RED='+Number(DATA.red||0);if(DATA.clipRequired){document.getElementById('clipBox').classList.remove('hidden');if(DATA.clipSaved){applyClipLocked(DATA.clipUrl||'')}else if(DATA.clipMissing){document.getElementById('clipBtn').disabled=true;document.getElementById('clipUrl').readOnly=true;setMsg(document.getElementById('submitMsg'),'Final đã lưu ('+summary+'). Đã quá hạn nộp link video.','err')}else if(DATA.awaitingClip){document.getElementById('clipBtn').disabled=false;setMsg(document.getElementById('submitMsg'),'Final đã lưu ('+summary+'). Hãy nộp link video.','ok')}}else setMsg(document.getElementById('topMsg'),'Final đã lưu. '+summary+'.','ok');return}if(DATA.empty){document.getElementById('meta').textContent='DAY '+DATA.run.programDay;setMsg(document.getElementById('topMsg'),DATA.message||'Hôm nay không có từ cần Final.','ok');btn.classList.add('hidden');return}await ensureMic();WORDS=DATA.words||[];sessionId=DATA.sessionId;testStartIso=DATA.startTime;idx=0;finalResults=[];testRunning=true;testStartPerf=performance.now();document.getElementById('meta').textContent='DAY '+DATA.run.programDay+' · '+WORDS.length+' từ · bắt đầu '+DATA.run.finalOpen+' · hạn '+DATA.run.finalDeadline;document.getElementById('testCard').classList.remove('hidden');document.getElementById('nextBtn').classList.remove('hidden');document.getElementById('stopBtn').classList.remove('hidden');document.getElementById('startBtn').classList.add('hidden');prepareWord()}catch(e){setMsg(document.getElementById('topMsg'),String(e.message||e),'err');btn.disabled=false}}
async function ensureMic(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Trình duyệt không hỗ trợ microphone');const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop());const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)throw new Error('Hãy dùng Chrome/Edge có hỗ trợ nhận diện giọng nói')}
function prepareWord(){if(!testRunning)return;if(idx>=WORDS.length){finishTest();return}clearTimers();safeAbort();responseLocked=false;currentUtterance='';firstAnswer='';finalAnswer='';finalAlternatives=[];restartCount=0;voiceDetectedCurrent=false;firstSpeechTime=null;const it=WORDS[idx];document.getElementById('progress').textContent=(idx+1)+' / '+WORDS.length+' · '+it.source;document.getElementById('vietnamese').textContent=it.vietnamese;document.getElementById('heard').textContent='Đang nghe...';document.getElementById('firstAnswer').textContent='---';document.getElementById('finalAnswer').textContent='---';document.getElementById('restartInfo').textContent='Có thể nói '+String(IEC_CONFIG.RESTART_WORD||'AGAIN')+' 1 lần trong thời gian phản xạ';document.getElementById('status').textContent='ĐANG NGHE';document.getElementById('timer').textContent='0.00 s';wordStartTime=performance.now();startReactionTimer();startRecognition('PRIMARY')}
function startRecognition(mode){if(!testRunning||responseLocked)return;safeAbort();const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=true;recognition.maxAlternatives=Math.max(1,Number(IEC_CONFIG.STT_MAX_ALTERNATIVES||5));let speechSeen=false;
recognition.onstart=()=>{if(mode==='REANSWER')document.getElementById('status').textContent='ĐANG NGHE – TRẢ LỜI LẠI';else if(mode==='AGAIN_WINDOW')document.getElementById('status').textContent='NÓI AGAIN NGAY NẾU MUỐN SỬA';};
recognition.onspeechstart=()=>{speechSeen=true;voiceDetectedCurrent=true;if(firstSpeechTime===null){firstSpeechTime=performance.now();stopReactionTimer();document.getElementById('timer').textContent=((firstSpeechTime-wordStartTime)/1000).toFixed(2)+' s'}startMaxSpeechTimer()};
recognition.onresult=(e)=>{let interim='',finalTop='',alts=[];for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal){finalTop=String(res[0]&&res[0].transcript||'').trim();alts=[];for(let j=0;j<res.length;j++){const t=String(res[j]&&res[j].transcript||'').trim();if(t&&!alts.includes(t))alts.push(t)}}else interim+=String(res[0]&&res[0].transcript||'')}currentUtterance=finalTop||interim.trim()||currentUtterance;if(currentUtterance)document.getElementById('heard').textContent=currentUtterance;if(finalTop)processFinalUtterance(finalTop,alts,mode)};
recognition.onerror=(e)=>{if(responseLocked||!testRunning)return;if(e.error==='not-allowed'||e.error==='service-not-allowed'){lockResponse('NO_VOICE');return}};
recognition.onend=()=>{if(responseLocked||!testRunning)return;if(mode==='PRIMARY'&&firstSpeechTime===null){const elapsed=(performance.now()-wordStartTime)/1000;if(elapsed<Number(IEC_CONFIG.REACTION_LIMIT_SEC||20)){setTimeout(()=>startRecognition('PRIMARY'),80);return}lockResponse('REACTION');return}if(mode==='AGAIN_WINDOW'){finalizeAnswer();return}if(mode==='REANSWER'){finalizeAnswer();return}};
try{recognition.start()}catch(e){setTimeout(()=>{if(!responseLocked)startRecognition(mode)},100)}if(mode==='AGAIN_WINDOW'){clearTimeout(silenceTimer);silenceTimer=setTimeout(()=>{if(!responseLocked)finalizeAnswer()},Number(IEC_CONFIG.SILENCE_END_SEC||5)*1000)}}
function processFinalUtterance(text,alts,mode){clearTimeout(maxSpeechTimer);const restart=String(IEC_CONFIG.RESTART_WORD||'AGAIN').trim().toLowerCase();const normalized=String(text||'').trim().toLowerCase();if(normalized===restart){handleAgain();return}if(mode==='PRIMARY'){firstAnswer=text;finalAnswer=text;finalAlternatives=alts.slice();document.getElementById('firstAnswer').textContent=firstAnswer;document.getElementById('finalAnswer').textContent=finalAnswer;startRecognition('AGAIN_WINDOW');return}if(mode==='REANSWER'){finalAnswer=text;finalAlternatives=alts.slice();document.getElementById('finalAnswer').textContent=finalAnswer;finalizeAnswer();return}if(mode==='AGAIN_WINDOW'){finalizeAnswer();return}}
function canAgainNow(){return wordStartTime!==null&&(performance.now()-wordStartTime)<=Number(IEC_CONFIG.REACTION_LIMIT_SEC||20)*1000}
function handleAgain(){if(restartCount>=Number(IEC_CONFIG.MAX_RESTART||1)||!canAgainNow()){document.getElementById('restartInfo').textContent='KHÔNG THỂ AGAIN: đã hết quyền/thời gian';finalizeAnswer();return}restartCount++;document.getElementById('restartInfo').textContent='AGAIN '+restartCount+' / '+Number(IEC_CONFIG.MAX_RESTART||1)+' → hãy trả lời lại';finalAnswer='';finalAlternatives=[];document.getElementById('finalAnswer').textContent='ĐANG CHỜ TRẢ LỜI LẠI...';startRecognition('REANSWER')}
function finalizeAnswer(){if(!testRunning||responseLocked)return;if(!finalAnswer&&currentUtterance){finalAnswer=currentUtterance;finalAlternatives=finalAlternatives.length?finalAlternatives:[currentUtterance]}document.getElementById('finalAnswer').textContent=finalAnswer||'(không nhận được chữ)';lockResponse('ANSWER')}
function nextNow(){if(!testRunning||responseLocked)return;if(!voiceDetectedCurrent){lockResponse('NEXT_NO_VOICE');return}finalizeAnswer()}
function answerMatches(expected,cands){const norm=x=>String(x||'').trim().toLowerCase().replace(/\b4\b/g,'four').replace(/\b2\b/g,'two').replace(/[-/]/g,'').replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,'');const t=norm(expected);return cands.some(x=>norm(x)===t)}
function lockResponse(reason){if(responseLocked)return;responseLocked=true;clearTimers();safeAbort();const it=WORDS[idx],reaction=firstSpeechTime!==null?(firstSpeechTime-wordStartTime)/1000:null,cands=[finalAnswer].concat(finalAlternatives||[]).filter(Boolean);let status,fail='';if(!voiceDetectedCurrent||reaction===null){status='RED';fail='NO_VOICE'}else if(reaction>Number(IEC_CONFIG.REACTION_LIMIT_SEC||20)){status='RED';fail='REACTION'}else if(answerMatches(it.english,cands)){status='PASS'}else{status='PENDING';fail=finalAnswer?'STT_MISMATCH':'VOICE_NO_TEXT'}document.getElementById('status').innerHTML=status==='PASS'?'<span class="resultBlue">BLUE / PASS</span>':status==='PENDING'?'<span class="resultGreen">GREEN / CHỜ DUYỆT</span>':'<span class="resultRed">RED</span>';finalResults.push({contentId:it.contentId,source:it.source,reaction:reaction,firstAnswer:firstAnswer||'',finalAnswer:finalAnswer||'',alternatives:finalAlternatives||[],restartCount:restartCount,voiceDetected:voiceDetectedCurrent,failReason:fail,result:status,videoOffsetSec:(wordStartTime-testStartPerf)/1000});setTimeout(()=>{idx++;setTimeout(prepareWord,Number(IEC_CONFIG.NEXT_DELAY_SEC||1)*1000)},Number(IEC_CONFIG.RESULT_DISPLAY_SEC||1)*1000)}
function startReactionTimer(){stopReactionTimer();reactionClock=setInterval(()=>{if(!testRunning||responseLocked||firstSpeechTime!==null)return;document.getElementById('timer').textContent=((performance.now()-wordStartTime)/1000).toFixed(2)+' s'},60);reactionDeadline=setTimeout(()=>{if(!responseLocked&&firstSpeechTime===null)lockResponse('REACTION')},Number(IEC_CONFIG.REACTION_LIMIT_SEC||20)*1000)}
function stopReactionTimer(){clearInterval(reactionClock);clearTimeout(reactionDeadline);reactionClock=null;reactionDeadline=null}
function startMaxSpeechTimer(){clearTimeout(maxSpeechTimer);maxSpeechTimer=setTimeout(()=>{if(!responseLocked)finalizeAnswer()},Number(IEC_CONFIG.MAX_SPEECH_SEC||20)*1000)}
function clearTimers(){stopReactionTimer();clearTimeout(maxSpeechTimer);clearTimeout(silenceTimer);maxSpeechTimer=null;silenceTimer=null}
function safeAbort(){if(!recognition)return;try{recognition.onend=null;recognition.abort()}catch(e){}recognition=null}
function stopTest(){testRunning=false;clearTimers();safeAbort();document.getElementById('status').textContent='ĐÃ DỪNG BÀI'}
function finishTest(){testRunning=false;clearTimers();safeAbort();document.getElementById('progress').textContent=WORDS.length+' / '+WORDS.length;document.getElementById('vietnamese').textContent='HOÀN THÀNH';document.getElementById('timer').textContent='';const blue=finalResults.filter(x=>x.result==='PASS').length,green=finalResults.filter(x=>x.result==='PENDING').length,red=finalResults.length-blue-green;document.getElementById('status').innerHTML='HOÀN THÀNH · <span class="resultBlue">BLUE '+blue+'</span> · <span class="resultGreen">GREEN '+green+'</span> · <span class="resultRed">RED '+red+'</span>';document.getElementById('nextBtn').classList.add('hidden');document.getElementById('stopBtn').classList.add('hidden');document.getElementById('clipBox').classList.remove('hidden');setMsg(document.getElementById('submitMsg'),'Đang lưu Final...');postPayload({api:'final-submit',classId:CTX.classId,studentId:CTX.studentId,runId:CTX.runId,token:CTX.token,sessionId:sessionId,startTime:testStartIso,results:finalResults})}
function clipKey(){return 'IEC_V3_CLIP::'+CTX.classId+'::'+CTX.studentId+'::'+CTX.runId}
function applyClipLocked(url){const i=document.getElementById('clipUrl'),b=document.getElementById('clipBtn');b.dataset.locked='1';b.disabled=true;i.readOnly=true;if(url&&!i.value)i.value=url;b.textContent='ĐÃ NỘP LINK ✓';setMsg(document.getElementById('submitMsg'),'ĐÃ GỬI LINK VIDEO. KHÔNG CẦN BẤM LẠI.','ok')}
function restoreClipState(){try{const u=localStorage.getItem(clipKey());if(u)applyClipLocked(u)}catch(e){}}
function submitClip(){const i=document.getElementById('clipUrl'),b=document.getElementById('clipBtn'),u=String(i.value||'').trim();if(b.dataset.locked==='1'||clipPending)return;if(!/^https?:\/\//i.test(u)){alert('Hãy dán link video hợp lệ bắt đầu bằng http/https.');return}clipPending=true;b.disabled=true;i.readOnly=true;b.textContent='ĐANG NỘP...';setMsg(document.getElementById('submitMsg'),'Đang gửi link video...');postPayload({api:'clip-submit',classId:CTX.classId,studentId:CTX.studentId,runId:CTX.runId,token:CTX.token,clipUrl:u})}
function handleBackendMessage(e){const d=e.data;if(!d||typeof d!=='object'||d.ok===undefined)return;if(!d.ok){if(clipPending){clipPending=false;const i=document.getElementById('clipUrl'),b=document.getElementById('clipBtn');b.disabled=false;i.readOnly=false;b.textContent='NỘP LINK VIDEO'}setMsg(document.getElementById('submitMsg'),'LỖI HỆ THỐNG: '+String(d.error||'Không xác định'),'err');return}if(d.clipSaved){clipPending=false;try{localStorage.setItem(clipKey(),d.clipUrl||document.getElementById('clipUrl').value)}catch(e){}applyClipLocked(d.clipUrl||'');return}if(d.sessionId||d.saved!==undefined){const b=document.getElementById('clipBtn');if(b.dataset.locked!=='1')b.disabled=false;setMsg(document.getElementById('submitMsg'),'Đã lưu Final. BLUE='+Number(d.blue||0)+' · GREEN='+Number(d.green||0)+' · RED='+Number(d.red||0)+'.','ok')}}
</script></body></html>
