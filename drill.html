<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>IEC V3 – Drill</title><link rel="stylesheet" href="styles.css"><script src="config.js?v=20261001rc2clean"></script><script src="common.js?v=20261001rc2clean"></script></head><body><div class="wrap">
<div class="card"><h1>IEC V3 – DRILL</h1><div class="sub">RED NEW + RED OLD · luyện không giới hạn</div><div id="meta" class="statusbar"></div><div class="row"><button id="greenBtn" class="secondary">XEM KẾT QUẢ GREEN</button></div></div>
<div id="greenCard" class="card hidden"><h2>Kết quả xem xét GREEN</h2><table><thead><tr><th>Từ</th><th>Kết quả</th><th>Lỗi</th><th>Nhận xét</th></tr></thead><tbody id="greenRows"></tbody></table><div id="greenEmpty" class="muted"></div></div>
<div id="studyCard" class="card hidden"><div class="row" style="justify-content:space-between"><div><h2>1. Luyện RED</h2><div class="muted">Nghe → Nghe – nói lại → Shadowing.</div></div><div class="row"><label>Tốc độ</label><select id="rate"></select></div></div><div id="studyList"></div><button id="startTest">BẮT ĐẦU DRILL</button></div>
<div id="testCard" class="card hidden"><h2>2. Drill Test</h2><div id="questions"></div><button id="submitBtn">NỘP DRILL</button><div id="msg" class="msg"></div></div>
<div id="clearCard" class="card hidden"><h2>Không còn RED cần luyện trong danh sách hôm nay</h2><div class="msg ok">Bạn có thể xem Kết quả GREEN hoặc quay lại khi hệ thống có RED mới.</div></div>
</div><iframe name="submitFrame" class="hidden"></iframe>
<script>
let CTX,DATA;
document.addEventListener('DOMContentLoaded',async()=>{window.addEventListener('message',handleMessage);document.getElementById('greenBtn').addEventListener('click',toggleGreen);document.getElementById('startTest').addEventListener('click',startTest);document.getElementById('submitBtn').addEventListener('click',submitDrill);try{CTX=requireContext();await loadClientConfig();setupRates();await loadData()}catch(e){document.getElementById('meta').textContent=String(e.message||e)}});
function setupRates(){const s=document.getElementById('rate'),rates=(IEC_CONFIG.TTS_RATES&&IEC_CONFIG.TTS_RATES.length?IEC_CONFIG.TTS_RATES:[.7,.85,1]);s.innerHTML='';rates.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=Number(r).toFixed(2).replace(/0$/,'')+'×';if(Math.abs(Number(r)-Number(IEC_CONFIG.TTS_DEFAULT_RATE||1))<.001)o.selected=true;s.appendChild(o)})}
async function loadData(){const url=API_BASE+'?api=drill-data&class='+encodeURIComponent(CTX.classId)+'&student='+encodeURIComponent(CTX.studentId)+'&run='+encodeURIComponent(CTX.runId)+'&token='+encodeURIComponent(CTX.token);DATA=await jsonp(url);if(!DATA||DATA.ok===false)throw new Error(DATA&&DATA.error||'Không tải được Drill');document.getElementById('meta').textContent='DAY '+DATA.run.programDay+' · RED hiện tại: '+DATA.count;document.getElementById('testCard').classList.add('hidden');if(!DATA.items.length){document.getElementById('studyCard').classList.add('hidden');document.getElementById('clearCard').classList.remove('hidden');return}document.getElementById('clearCard').classList.add('hidden');renderStudy();document.getElementById('studyCard').classList.remove('hidden')}
function renderStudy(){const box=document.getElementById('studyList');box.innerHTML='';DATA.items.forEach((it,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML='<div class="tag">'+String(i+1).padStart(2,'0')+' · '+it.redType+' · '+it.contentId+'</div><div class="vn"></div><div class="en"></div><div class="ipa"></div><div class="tts"><button class="secondary listen">🔊 Nghe</button><button class="secondary repeat">🔁 Nghe ×'+Number(IEC_CONFIG.TTS_REPEAT||3)+'</button></div>';d.querySelector('.vn').textContent=it.vietnamese;d.querySelector('.en').textContent=it.english;d.querySelector('.ipa').textContent=it.ipa||'';d.querySelector('.listen').onclick=()=>ttsSpeak(it.english,Number(document.getElementById('rate').value),1);d.querySelector('.repeat').onclick=()=>ttsSpeak(it.english,Number(document.getElementById('rate').value),Number(IEC_CONFIG.TTS_REPEAT||3));box.appendChild(d)})}
function startTest(){stopTts();document.getElementById('studyCard').classList.add('hidden');document.getElementById('testCard').classList.remove('hidden');const box=document.getElementById('questions');box.innerHTML='';DATA.items.forEach((it,i)=>{const r=document.createElement('div');r.className='test-row';r.innerHTML='<div class="num">'+String(i+1).padStart(2,'0')+'</div><div class="vn"></div><input type="text" autocomplete="off" placeholder="Nhập thuật ngữ tiếng Anh">';r.querySelector('.vn').textContent=it.vietnamese;r.querySelector('input').dataset.contentId=it.contentId;box.appendChild(r)});const first=box.querySelector('input');if(first)first.focus()}
function submitDrill(){const btn=document.getElementById('submitBtn'),answers=[...document.querySelectorAll('#questions input')].map(x=>({contentId:x.dataset.contentId,answer:x.value.trim()}));btn.disabled=true;setMsg(document.getElementById('msg'),'Đang gửi...');postPayload({api:'drill-submit',classId:CTX.classId,studentId:CTX.studentId,runId:CTX.runId,token:CTX.token,answers:answers,clientKey:clientKey('DRILL')})}
function handleMessage(e){const d=e.data;if(!d||typeof d!=="object"||d.ok===undefined)return;const msg=document.getElementById('msg'),btn=document.getElementById('submitBtn');if(!d.ok){btn.disabled=false;setMsg(msg,'LỖI: '+String(d.error||'Không xác định'),'err');return}setMsg(msg,'ĐÃ LUYỆN ĐẠT='+Number(d.repaired||0)+' · CÒN CẦN LUYỆN='+Number(d.remaining||0)+'.','ok');setTimeout(()=>{btn.disabled=false;loadData()},700)}
async function toggleGreen(){const card=document.getElementById('greenCard');if(!card.classList.contains('hidden')){card.classList.add('hidden');return}const d=await jsonp(API_BASE+'?api=green-results&class='+encodeURIComponent(CTX.classId)+'&student='+encodeURIComponent(CTX.studentId)+'&token='+encodeURIComponent(CTX.token));if(!d||d.ok===false){alert(d&&d.error||'Không tải được kết quả GREEN');return}const tb=document.getElementById('greenRows');tb.innerHTML='';document.getElementById('greenEmpty').textContent=d.items.length?'':'Chưa có kết quả GREEN đã được TA xem xét.';d.items.forEach(x=>{const tr=document.createElement('tr');tr.innerHTML='<td></td><td></td><td></td><td></td>';tr.children[0].textContent=x.word;tr.children[1].textContent=x.result;tr.children[1].className=x.result==='BLUE'?'resultBlue':'resultRed';tr.children[2].textContent=x.error||'—';tr.children[3].textContent=x.comment||'—';tb.appendChild(tr)});card.classList.remove('hidden')}
</script></body></html>
