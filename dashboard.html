<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>IEC V3 – Dashboard</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="common.js"></script></head><body><div class="wrap">
<div class="card"><h1>IEC V3 – DASHBOARD</h1><div class="sub">MASTER → CLASS → STUDENT. Dashboard chỉ đọc summary, không quét RAW.</div><div class="row" style="margin-top:12px"><button id="reload">LÀM MỚI</button></div></div>
<div class="card"><h2>Tổng quan các lớp</h2><table><thead><tr><th>Lớp</th><th>Phase</th><th>Day</th><th>SV</th><th>Morning</th><th>RED</th><th>Final</th><th>Green chờ</th><th>TA</th></tr></thead><tbody id="classes"></tbody></table></div>
<div id="classCard" class="card hidden"><div class="row" style="justify-content:space-between"><h2 id="classTitle"></h2><div class="row"><label><b>DAY</b></label><select id="runSelect"></select></div></div><div id="kpis" class="kpis"></div><table><thead><tr><th>SV</th><th>Morning</th><th>RED NEW</th><th>RED OLD</th><th>Drill</th><th>Final</th><th>Blue</th><th>Green</th><th>Red</th><th>Video</th><th>Review</th></tr></thead><tbody id="students"></tbody></table></div>
</div><script>
const TOKEN=qp('token');let CURRENT_CLASS='';document.addEventListener('DOMContentLoaded',async()=>{document.getElementById('reload').onclick=loadMaster;document.getElementById('runSelect').onchange=()=>{if(CURRENT_CLASS)loadClass(CURRENT_CLASS,document.getElementById('runSelect').value)};try{await loadClientConfig();if(!TOKEN)throw new Error('Thiếu admin token');await loadMaster()}catch(e){alert(String(e.message||e))}});
async function loadMaster(){const d=await jsonp(API_BASE+'?api=dashboard-master&token='+encodeURIComponent(TOKEN),60000);if(!d||d.ok===false){alert(d&&d.error||'Không tải dashboard');return}const tb=document.getElementById('classes');tb.innerHTML='';(d.classes||[]).forEach(c=>{const tr=document.createElement('tr');tr.innerHTML='<td><button class="secondary"></button></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>';tr.children[0].querySelector('button').textContent=c.CLASS_NAME||c.CLASS_ID;tr.children[0].querySelector('button').onclick=()=>loadClass(c.CLASS_ID);tr.children[1].textContent=c.PHASE||'';tr.children[2].textContent=c.PROGRAM_DAY||'';tr.children[3].textContent=c.ACTIVE_STUDENTS||0;tr.children[4].textContent=(c.MORNING_DONE||0)+'/'+(c.ACTIVE_STUDENTS||0);tr.children[5].textContent=c.CURRENT_RED||0;tr.children[6].textContent=(c.FINAL_DONE||0)+'/'+(c.ACTIVE_STUDENTS||0);tr.children[7].textContent=c.GREEN_WAITING||0;tr.children[8].textContent=c.TA||'';tb.appendChild(tr)})}
async function loadClass(classId,runId=''){CURRENT_CLASS=classId;const d=await jsonp(API_BASE+'?api=dashboard-class&admin=true&class='+encodeURIComponent(classId)+(runId?'&run='+encodeURIComponent(runId):'')+'&token='+encodeURIComponent(TOKEN),60000);if(!d||d.ok===false){alert(d&&d.error||'Không tải lớp');return}const card=document.getElementById('classCard');card.classList.remove('hidden');const sel=document.getElementById('runSelect'),selected=d.run&&d.run.runId||'';sel.innerHTML='';(d.runs||[]).forEach(r=>{const o=document.createElement('option');o.value=r.runId;o.textContent='DAY '+r.programDay+' · '+r.date+' · '+r.phaseId+(r.status?' · '+r.status:'');if(r.runId===selected)o.selected=true;sel.appendChild(o)});document.getElementById('classTitle').textContent=classId+(d.run?' · DAY '+d.run.programDay+' · '+d.run.phaseId:'');const s=d.students||[],sum=(k)=>s.reduce((a,x)=>a+Number(x[k]||0),0),done=(k,v)=>s.filter(x=>String(x[k]||'')===v).length;document.getElementById('kpis').innerHTML='<div class="kpi">SV<b>'+s.length+'</b></div><div class="kpi">Morning xong<b>'+done('MORNING_STATUS','DONE')+'</b></div><div class="kpi">RED NEW<b>'+sum('RED_NEW_COUNT')+'</b></div><div class="kpi">RED OLD<b>'+sum('RED_OLD_COUNT')+'</b></div><div class="kpi">GREEN chờ<b>'+sum('REVIEW_WAITING')+'</b></div>';const tb=document.getElementById('students');tb.innerHTML='';s.forEach(x=>{const tr=document.createElement('tr');['STUDENT_ID','MORNING_STATUS','RED_NEW_COUNT','RED_OLD_COUNT','DRILL_STATUS','FINAL_STATUS','BLUE_COUNT','GREEN_COUNT','RED_COUNT','VIDEO_STATUS','REVIEW_WAITING'].forEach(k=>{const td=document.createElement('td');td.textContent=(k==='STUDENT_ID'&&x.FULL_NAME)?x.STUDENT_ID+' · '+x.FULL_NAME:(x[k]??'');tr.appendChild(td)});tb.appendChild(tr)})}
</script></body></html>
